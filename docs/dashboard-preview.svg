<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">easyWrapper dashboard preview</title>
  <desc id="desc">Mock dashboard showing wrapped-style cards for top artists, tracks, listening diversity, and monthly activity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <rect x="60" y="50" width="1280" height="780" rx="28" fill="#111827" stroke="#2b3347"/>
  <text x="90" y="106" font-family="Arial, sans-serif" font-size="28" fill="#f8fafc" font-weight="700">easyWrapper</text>
  <text x="90" y="145" font-family="Arial, sans-serif" font-size="14" fill="#a5b4fc">Listening summary dashboard</text>

  <rect x="90" y="180" width="190" height="120" rx="18" fill="#1f2937" stroke="#374151"/>
  <text x="110" y="220" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Total plays</text>
  <text x="110" y="265" font-family="Arial, sans-serif" font-size="38" fill="#f8fafc" font-weight="700">214</text>

  <rect x="300" y="180" width="190" height="120" rx="18" fill="#1f2937" stroke="#374151"/>
  <text x="320" y="220" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Top artist</text>
  <text x="320" y="265" font-family="Arial, sans-serif" font-size="24" fill="#f8fafc" font-weight="700">Laufey</text>

  <rect x="510" y="180" width="190" height="120" rx="18" fill="#1f2937" stroke="#374151"/>
  <text x="530" y="220" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Listening diversity</text>
  <text x="530" y="265" font-family="Arial, sans-serif" font-size="38" fill="#f8fafc" font-weight="700">0.74</text>

  <rect x="720" y="180" width="190" height="120" rx="18" fill="url(#accent)"/>
  <text x="740" y="220" font-family="Arial, sans-serif" font-size="12" fill="#fdf2f8">New artists</text>
  <text x="740" y="265" font-family="Arial, sans-serif" font-size="38" fill="#fff" font-weight="700">32%</text>

  <rect x="90" y="340" width="520" height="310" rx="22" fill="#0f172a" stroke="#374151"/>
  <text x="110" y="378" font-family="Arial, sans-serif" font-size="18" fill="#f8fafc" font-weight="700">Top artists</text>
  <line x1="110" y1="392" x2="560" y2="392" stroke="#334155"/>
  <rect x="110" y="420" width="420" height="18" rx="9" fill="#1f2937"/>
  <rect x="110" y="420" width="330" height="18" rx="9" fill="#8b5cf6"/>
  <text x="110" y="472" font-family="Arial, sans-serif" font-size="15" fill="#e2e8f0">Laufey</text>
  <text x="490" y="472" font-family="Arial, sans-serif" font-size="15" fill="#cbd5e1">48 plays</text>

  <rect x="110" y="488" width="420" height="18" rx="9" fill="#1f2937"/>
  <rect x="110" y="488" width="260" height="18" rx="9" fill="#ec4899"/>
  <text x="110" y="540" font-family="Arial, sans-serif" font-size="15" fill="#e2e8f0">Faye Webster</text>
  <text x="490" y="540" font-family="Arial, sans-serif" font-size="15" fill="#cbd5e1">31 plays</text>

  <rect x="110" y="556" width="420" height="18" rx="9" fill="#1f2937"/>
  <rect x="110" y="556" width="200" height="18" rx="9" fill="#f59e0b"/>
  <text x="110" y="608" font-family="Arial, sans-serif" font-size="15" fill="#e2e8f0">The National</text>
  <text x="490" y="608" font-family="Arial, sans-serif" font-size="15" fill="#cbd5e1">24 plays</text>

  <rect x="640" y="340" width="620" height="310" rx="22" fill="#0f172a" stroke="#374151"/>
  <text x="660" y="378" font-family="Arial, sans-serif" font-size="18" fill="#f8fafc" font-weight="700">Month-over-month trend</text>
  <line x1="660" y1="408" x2="1230" y2="408" stroke="#334155"/>
  <polyline fill="none" stroke="#8b5cf6" stroke-width="4" points="660,530 760,500 860,470 960,390 1060,330 1160,300"/>
  <circle cx="660" cy="530" r="5" fill="#8b5cf6"/>
  <circle cx="760" cy="500" r="5" fill="#8b5cf6"/>
  <circle cx="860" cy="470" r="5" fill="#8b5cf6"/>
  <circle cx="960" cy="390" r="5" fill="#8b5cf6"/>
  <circle cx="1060" cy="330" r="5" fill="#8b5cf6"/>
  <circle cx="1160" cy="300" r="5" fill="#8b5cf6"/>
  <text x="660" y="610" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Jan</text>
  <text x="760" y="610" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Feb</text>
  <text x="860" y="610" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Mar</text>
  <text x="960" y="610" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Apr</text>
  <text x="1060" y="610" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">May</text>
  <text x="1160" y="610" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Jun</text>

  <rect x="90" y="690" width="1170" height="90" rx="18" fill="#1f2937" stroke="#374151"/>
  <text x="110" y="725" font-family="Arial, sans-serif" font-size="16" fill="#f8fafc" font-weight="700">Evidence-backed summary</text>
  <text x="110" y="752" font-family="Arial, sans-serif" font-size="15" fill="#cbd5e1">Your listening pattern appears balanced, your artist diversity is stable, and your discovery rate indicates a healthy mix of novelty and repeat comfort.</text>
</svg>
