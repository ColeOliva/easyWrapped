[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easywrapper"
version = "0.1.0"
description = "Wrapped-style music listening analytics from CSV exports."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Cole Oliva" }]
license = { text = "MIT" }
keywords = ["music", "analytics", "wrapped", "csv", "report"]
dependencies = [
  "requests>=2.32.0",
]

[project.optional-dependencies]
pdf = ["reportlab>=4.2.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
easywrapper = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
